<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Freewar Chat Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f2f2f2;
    }
    .searchbar {
      margin-bottom: 20px;
    }
    .datestamp {
      font-weight: bold;
      color: #333;
      display: block;
      margin-top: 10px;
    }
    .shout {
      color: red;
      font-weight: bold;
    }
    .welt-button {
      margin-right: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Freewar Chat Tracker</h1>

  <div class="searchbar">
    🔍 <input type="text" id="search" placeholder="Suche..." oninput="saveSearch()" />
  </div>

  <div class="welt-buttons">
    <button class="welt-button" onclick="switchWorld('global')">🌍 Global</button>
    {% for i in range(1, 15) %}
      <button class="welt-button" onclick="switchWorld('{{ i }}')">🌐 Welt {{ i }}</button>
    {% endfor %}
  </div>

  <div id="chatbox">
    {{ logs|safe }}
  </div>

  <script>
    function saveSearch() {
      const value = document.getElementById('search').value;
      localStorage.setItem('chatsearch', value);
    }

    function loadSearch() {
      const value = localStorage.getItem('chatsearch');
      if (value) document.getElementById('search').value = value;
    }

    function switchWorld(welt) {
      window.location.href = `/?welt=${welt}`;
    }

    // Lade gespeicherten Suchbegriff nach dem Seitenladen
    window.onload = loadSearch;
  </script>
</body>
</html>
